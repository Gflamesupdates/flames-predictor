<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026/27 Season Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>2026/27 Season Predictor</h1>
        <div class="subtitle">Rank the teams and generate your season graphic</div>
    </div>

    <!-- Predictor Container -->
    <div class="predictor-container">

        <!-- TABLE (this was missing) -->
        <div id="tableContainer"></div>

        <!-- WINNER SELECTORS -->
        <div class="winner-selectors">
            <label>Challenge Cup Winner:</label><br>
            <select id="cupWinner">
                <option>Cardiff Devils</option>
                <option>Belfast Giants</option>
                <option>Dundee Stars</option>
                <option>Coventry Blaze</option>
                <option>Glasgow Clan</option>
                <option>Fife Flyers</option>
                <option>Guildford Flames</option>
                <option>Manchester Storm</option>
                <option>Nottingham Panthers</option>
                <option>Sheffield Steelers</option>
            </select>

            <br><br>

            <label>Playoff Winner:</label><br>
            <select id="playoffWinner">
                <option>Cardiff Devils</option>
                <option>Belfast Giants</option>
                <option>Dundee Stars</option>
                <option>Coventry Blaze</option>
                <option>Glasgow Clan</option>
                <option>Fife Flyers</option>
                <option>Guildford Flames</option>
                <option>Manchester Storm</option>
                <option>Nottingham Panthers</option>
                <option>Sheffield Steelers</option>
            </select>
        </div>

        <!-- GENERATE BUTTON (this was missing) -->
        <button id="generate" class="submit-btn">Generate Prediction</button>

        <!-- CANVAS (this was missing) -->
        <canvas id="predictorCanvas" width="1080" height="1400"></canvas>

    </div>

    <script src="Sortable.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
