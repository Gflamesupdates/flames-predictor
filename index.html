<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guildford Flames EIHL Predictor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header">
  <h1>Guildford Flames EIHL Predictor</h1>
  <p>Drag the EIHL teams into your predicted final standings.</p>
</div>

<div class="predictor-box">
  <ol id="teamList" class="team-list">
    <li>Belfast Giants</li>
    <li>Cardiff Devils</li>
    <li>Coventry Blaze</li>
    <li>Dundee Stars</li>
    <li>Fife Flyers</li>
    <li>Glasgow Clan</li>
    <li>Guildford Flames</li>
    <li>Manchester Storm</li>
    <li>Nottingham Panthers</li>
    <li>Sheffield Steelers</li>
  </ol>

  <button id="submitBtn">Submit Prediction</button>
  <div id="result"></div>

  <button id="downloadBtn" style="display:none;">Download Prediction Image</button>
  <canvas id="shareCanvas" width="800" height="1200" style="display:none;"></canvas>
</div>

<!-- Your watermark image -->
<img id="flamesImage" src="flames-watermark.png" style="display:none;">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="script.js"></script>

</body>
</html>
